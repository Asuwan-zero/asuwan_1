<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เลือกตำแหน่งส่งของ</title>
  <script src="https://api.longdo.com/map/?key=986a3127ff7d6ab6854f05d51f342631"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #f5f5f5; }

    .container {
      max-width: 640px;
      margin: 24px auto;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }

    #map { width: 100%; height: 360px; position: relative; }

    /* ปุ่ม GPS */
    #gps-btn {
      position: absolute;
      bottom: 80px;
      right: 12px;
      z-index: 999;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #ccc;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    #gps-btn:hover { background: #f0f0f0; }

    .form-area { padding: 16px 20px; }

    .pin-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #888;
      margin-bottom: 14px;
    }
    .pin-status.active { color: #222; }
    .pin-icon { font-size: 18px; }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #1a73e8; }

    #confirm-btn {
      width: 100%;
      padding: 12px;
      background: #eee;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      color: #999;
      cursor: not-allowed;
      transition: background 0.2s, color 0.2s;
    }
    #confirm-btn.ready {
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
    }
    #confirm-btn.ready:hover { background: #1558b0; }

    .result-box {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      background: #e6f4ea;
      border-radius: 8px;
      font-size: 13px;
      color: #1e7e34;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="map">
    <button id="gps-btn" title="ใช้ตำแหน่งปัจจุบัน" aria-label="ใช้ตำแหน่งปัจจุบัน">
      📍
    </button>
  </div>

  <div class="form-area">
    <div class="pin-status" id="pin-status">
      <span class="pin-icon">🗺️</span>
      <span id="status-text">ยังไม่ได้ปักหมุด — กดปุ่ม 📍 หรือคลิกบนแผนที่</span>
    </div>

    <input type="text" id="note" placeholder="หมายเหตุ เช่น บ้านสีเหลือง หน้า 7-11" />

    <button id="confirm-btn" disabled>✓ ยืนยันตำแหน่ง</button>

    <div class="result-box" id="result-box">
      ✅ <strong>บันทึกตำแหน่งแล้ว!</strong><br>
      <span id="result-text"></span>
    </div>
  </div>
</div>

<script>
  var map = new longdo.Map({
    placeholder: document.getElementById('map'),
    language: longdo.Language.THAI,
    zoom: 12,
    lastView: false,
  });

  // ตั้งค่าเริ่มต้นที่กรุงเทพ
  map.location({ lon: 100.5233, lat: 13.7367 }, true);

  var marker = null;
  var selectedLat = null;
  var selectedLon = null;

  var statusText = document.getElementById('status-text');
  var pinStatus = document.getElementById('pin-status');
  var confirmBtn = document.getElementById('confirm-btn');
  var resultBox = document.getElementById('result-box');
  var resultText = document.getElementById('result-text');

  function placeMarker(lat, lon, label) {
    selectedLat = parseFloat(lat).toFixed(5);
    selectedLon = parseFloat(lon).toFixed(5);

    if (marker) map.Overlays.remove(marker);

    marker = new longdo.Marker(
      { lon: selectedLon, lat: selectedLat },
      { title: 'ตำแหน่งส่งของ', detail: label || '' }
    );
    map.Overlays.add(marker);
    map.location({ lon: selectedLon, lat: selectedLat }, true);

    statusText.textContent = label || `ละติจูด ${selectedLat}, ลองจิจูด ${selectedLon}`;
    pinStatus.classList.add('active');

    confirmBtn.disabled = false;
    confirmBtn.classList.add('ready');
    resultBox.style.display = 'none';
  }

  // คลิกบนแผนที่
  map.Event.bind('click', function() {
    var loc = map.location();
    placeMarker(loc.lat, loc.lon);
  });

  // ปุ่ม GPS
  document.getElementById('gps-btn').addEventListener('click', function() {
    var btn = this;
    btn.textContent = '⏳';
    btn.disabled = true;

    if (!navigator.geolocation) {
      alert('เบราว์เซอร์นี้ไม่รองรับ GPS');
      btn.textContent = '📍';
      btn.disabled = false;
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function(pos) {
        var lat = pos.coords.latitude;
        var lon = pos.coords.longitude;
        placeMarker(lat, lon, `ตำแหน่งปัจจุบัน (${parseFloat(lat).toFixed(5)}, ${parseFloat(lon).toFixed(5)})`);
        btn.textContent = '✅';
        setTimeout(function() {
          btn.textContent = '📍';
          btn.disabled = false;
        }, 2000);
      },
      function() {
        alert('ไม่สามารถดึงตำแหน่งได้ กรุณาอนุญาต GPS ก่อนครับ');
        btn.textContent = '📍';
        btn.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  // ยืนยัน
  confirmBtn.addEventListener('click', function() {
    var note = document.getElementById('note').value;
    resultBox.style.display = 'block';
    resultText.innerHTML = `พิกัด: ${selectedLat}, ${selectedLon}` + (note ? `<br>หมายเหตุ: ${note}` : '');
    confirmBtn.textContent = '✓ บันทึกแล้ว';
    confirmBtn.classList.remove('ready');
    confirmBtn.disabled = true;
  });
</script>

</body>
</html>
