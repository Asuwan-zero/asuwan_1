<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Restaurant</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #fff;
        }

        /* ===== NAV ===== */
        nav {
            background-color: #302b2bce;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: opacity 0.2s;
        }

        nav ul li a:hover {
            opacity: 0.75;
        }

        /* ===== HERO BANNER ===== */
        .hero-banner {
            height: 420px;
            background: linear-gradient(135deg, #3d2c2c 0%, #6b4c3b 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 10%;
            gap: 16px;
        }

        .hero-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #fff;
        }

        .hero-banner p {
            font-size: 1.1rem;
            color: #e0d5cc;
        }

        .hero-banner button {
            margin-top: 8px;
            padding: 12px 28px;
            background-color: #b4a089;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Lato', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .hero-banner button:hover {
            background-color: #9a856e;
        }

        /* ===== SECOND SECTION ===== */
        .second-section {
            background-color: rgb(255, 248, 246);
            padding: 40px 5%;
            min-height: 100vh;
        }

        .second-section > h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
            color: #3d2c2c;
        }

        /* ===== RECOMMENDED PRODUCTS ===== */
        .recommended-products {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .product {
            background-color: #fff;
            border: 1px solid #e8ddd6;
            border-radius: 12px;
            padding: 20px 24px;
            min-width: 200px;
            flex: 1;
            max-width: 280px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .product h3 {
            font-family: 'Playfair Display', serif;
            color: #3d2c2c;
            margin-bottom: 8px;
        }

        .product p {
            color: #7a6a5a;
            font-size: 0.95rem;
        }

        /* ===== MENU SECTION ===== */
        .menu-section {
            margin-top: 20px;
        }

        .menu-section h4 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #3d2c2c;
            margin-bottom: 20px;
        }

        .menu-items {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
        }

        .menu-card {
            background-color: #b4a089;
            padding: 12px 20px;
            color: #fff;
            margin-right: 12px;
            margin-bottom: 12px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .menu-card:hover {
            background-color: #9a856e;
        }

        .menu-card h3 {
            font-size: 1rem;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav>
        <div class="logo">
            <h1>Logo</h1>
        </div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- HERO -->
    <section>
        <div class="hero-banner">
            <h1>Welcome to My Website</h1>
            <p>Discover our delicious menu and cozy atmosphere.</p>
            <button>Order Now</button>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <section class="second-section">

        <h2>Recommended Products</h2>

        <div class="recommended-products">
            <div class="product">
                <h3>Product 1</h3>
                <p>Description of Product 1.</p>
            </div>
            <div class="product">
                <h3>Product 2</h3>
                <p>Description of Product 2.</p>
            </div>
            <div class="product">
                <h3>Product 3</h3>
                <p>Description of Product 3.</p>
            </div>
        </div>

        <div class="menu-section">
            <h4>Our Menu</h4>
            <div class="menu-items">
                <div class="menu-card"><h3>Asuwan</h3></div>
                <div class="menu-card"><h3>Water Menu</h3></div>
                <div class="menu-card"><h3>Ries</h3></div>
            </div>
        </div>

    </section>

</body>
</html>
